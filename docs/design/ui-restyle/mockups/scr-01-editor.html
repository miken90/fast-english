<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060a">
<title>SCR-01 Editor — ui-restyle mockup</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  /* Mockup-only scaffolding. Follows: Hashnode rewrite popup (layout shape),
     Canva Magic Write (tool chips), Superhuman/Fey (kbd chips). */
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #05060a; min-height: 100vh; display: grid; place-items: center;
    font-family: var(--font-family); padding: 40px;
  }
  .popup {
    width: 520px; background: var(--color-surface-base);
    border-radius: 20px; box-shadow: var(--shadow-popup);
    border: 1px solid var(--color-border-subtle);
    overflow: hidden; color: var(--color-text-primary);
  }
  /* Header — drag region */
  .hdr {
    display: flex; align-items: center; gap: var(--spacing-sm);
    padding: var(--spacing-md) var(--spacing-lg);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  .hdr .brand { display: flex; align-items: center; gap: 8px; font-size: var(--font-size-base); font-weight: var(--font-weight-semibold); }
  .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary-gradient); box-shadow: var(--shadow-glow); }
  .hdr .spacer { flex: 1; }
  .icon-btn {
    width: 30px; height: 30px; display: grid; place-items: center;
    background: transparent; border: none; border-radius: var(--radius-sm);
    color: var(--color-text-secondary); cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast);
  }
  .icon-btn:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* Tool pills */
  .tools { display: flex; gap: var(--spacing-sm); padding: var(--spacing-md) var(--spacing-lg) 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius-full);
    font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
    background: transparent; border: 1px solid transparent;
    color: var(--color-text-secondary); cursor: pointer;
    transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
  }
  .pill:hover { background: var(--color-surface-hover); color: var(--color-text-primary); }
  .pill:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .pill.sel-blue   { background: var(--color-tool-blue-bg);   color: var(--color-tool-blue-fg);   border-color: rgba(96,165,250,.35); }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Editor card */
  .card {
    margin: var(--spacing-md) var(--spacing-lg);
    background: var(--color-surface-card); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
  }
  textarea {
    width: 100%; min-height: 120px; resize: none; display: block;
    background: transparent; border: none; outline: none;
    padding: var(--spacing-md) 14px;
    color: var(--color-text-primary); font-family: var(--font-family);
    font-size: var(--font-size-md); line-height: var(--line-height-relaxed);
  }
  textarea::placeholder { color: var(--color-text-muted); }
  .card:focus-within { border-color: var(--color-border-focus); }
  .card-meta {
    display: flex; justify-content: flex-end;
    padding: 0 14px 8px; font-size: var(--font-size-xs); color: var(--color-text-muted);
  }

  /* Footer */
  .ftr {
    display: flex; align-items: center; gap: var(--spacing-md);
    padding: var(--spacing-sm) var(--spacing-lg) var(--spacing-lg);
  }
  .hint { display: inline-flex; align-items: center; gap: 6px; font-size: var(--font-size-xs); color: var(--color-text-muted); }
  kbd {
    font-family: var(--font-family); font-size: var(--font-size-xs);
    background: var(--color-kbd-bg); border: 1px solid var(--color-kbd-border);
    color: var(--color-kbd-fg); border-radius: var(--radius-sm); padding: 1px 6px;
  }
  .ftr .spacer { flex: 1; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 32px; padding: 0 18px;
    background: var(--color-primary-default); color: var(--color-text-on-primary);
    border: none; border-radius: var(--radius-md);
    font-size: var(--font-size-base); font-weight: var(--font-weight-semibold);
    cursor: pointer; transition: background var(--transition-fast), box-shadow var(--transition-fast);
  }
  .btn-primary:hover { background: var(--color-primary-hover); box-shadow: var(--shadow-glow); }
  .btn-primary:active { background: var(--color-primary-active); }
  .btn-primary:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .btn-primary svg { width: 13px; height: 13px; }

  .caption { max-width: 520px; margin-top: 16px; font-size: 12px; color: #5b6270; line-height: 1.5; }
  .caption a { color: #60A5FA; }
</style>
</head>
<body>
<div>
  <div class="popup" role="dialog" aria-label="Fast English">
    <div class="hdr">
      <span class="brand"><span class="brand-dot"></span>Fast English</span>
      <span class="spacer"></span>
      <button class="icon-btn" aria-label="History"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg></button>
      <button class="icon-btn" aria-label="Settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="icon-btn" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>

    <div class="tools" role="tablist" aria-label="Writing tools">
      <button class="pill sel-blue" role="tab" aria-selected="true"><span class="dot"></span>Enhance Writing</button>
      <button class="pill" role="tab" aria-selected="false">Fix Grammar</button>
      <button class="pill" role="tab" aria-selected="false">Convert Prompt</button>
      <button class="pill" role="tab" aria-selected="false">Translate</button>
    </div>

    <div class="card">
      <textarea aria-label="Source text">The meeting go well yesterday and everyone agree that we should move forward with the new plan as soon as possible.</textarea>
      <div class="card-meta">118 characters</div>
    </div>

    <div class="ftr">
      <span class="hint"><kbd>Esc</kbd> dismiss</span>
      <span class="spacer"></span>
      <span class="hint"><kbd>Ctrl</kbd><kbd>Enter</kbd></span>
      <button class="btn-primary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Run</button>
    </div>
  </div>

  <p class="caption">SCR-01 Editor · dark theme · follows
    <a href="https://mobbin.com/screens/092a8062-a1d1-47e9-beee-49031a9832d5">Hashnode rewrite popup</a> (compact over-content window),
    <a href="https://mobbin.com/screens/a7faf3e1-c2fc-4eec-b9ee-c2d975375b6c">Canva Magic Write</a> (tool chips),
    Superhuman/Fey (kbd hints). Error-banner + translate-selects states specced in design-spec.md §5.
  </p>
</div>
</body>
</html>
