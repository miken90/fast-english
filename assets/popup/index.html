<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast English</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<div id="popup-root">
  <div class="popup-container">

    <!-- ================================================
         VIEW: options
    ================================================ -->
    <section id="view-options" class="view" tabindex="-1">
      <div class="popup-header">
        <div class="context-indicator">
          <div class="status-dot status-dot--pulse"></div>
          <span class="label-upper">Context Active</span>
        </div>
        <button class="btn btn--icon" id="options-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="popup-title">How can I help?</div>
      <div class="popup-preview" id="options-preview"></div>

      <ul class="tool-list" id="tool-list" role="menu">
        <!-- Populated by setState -->
      </ul>

      <div class="popup-footer">
        <span class="footer-label" id="options-model-label">Powered by AI</span>
        <button class="footer-settings-btn" id="options-settings-btn">Settings</button>
      </div>
    </section>

    <!-- ================================================
         VIEW: translate-select
    ================================================ -->
    <section id="view-translate-select" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="translate-select-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <button class="btn btn--icon" id="translate-select-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="section-heading">Translate</div>

      <div class="translate-lang-row">
        <div class="lang-select-wrapper">
          <select class="lang-select" id="translate-from-select" aria-label="From language">
            <!-- Populated by setState -->
          </select>
          <span class="lang-select-arrow" data-icon-name="chevron_down" data-icon-size="12" data-icon-stroke="2.5"></span>
        </div>

        <button class="btn-swap" id="translate-swap-btn" aria-label="Swap languages">
          <span data-icon-name="swap" data-icon-size="14" data-icon-stroke="2"></span>
        </button>

        <div class="lang-select-wrapper">
          <select class="lang-select" id="translate-to-select" aria-label="To language">
            <!-- Populated by setState -->
          </select>
          <span class="lang-select-arrow" data-icon-name="chevron_down" data-icon-size="12" data-icon-stroke="2.5"></span>
        </div>
      </div>

      <div class="translate-input-wrapper">
        <div class="translate-panel-label">Text</div>
        <textarea class="translate-text-box translate-text-box--textarea" id="translate-input-text" placeholder="Enter or edit text to translate..."></textarea>
      </div>

      <div class="action-row pt-1">
        <button class="btn btn--primary" id="translate-confirm-btn">
          Translate
        </button>
      </div>

      <div class="pb-2"></div>
    </section>

    <!-- ================================================
         VIEW: translate-result
    ================================================ -->
    <section id="view-translate-result" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="translate-result-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <button class="btn btn--icon" id="translate-result-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="translate-panels">
        <div>
          <div class="translate-panel-label" id="tr-from-label">Original</div>
          <textarea class="translate-text-box translate-text-box--textarea" id="tr-original-text"></textarea>
        </div>

        <div class="translate-divider translate-divider--padded">
          <div class="translate-divider-line"></div>
          <span class="translate-divider-icon" data-icon-name="divider_down" data-icon-size="16" data-icon-stroke="2"></span>
          <div class="translate-divider-line"></div>
        </div>

        <div>
          <div class="translate-panel-label" id="tr-to-label">Translated</div>
          <div class="translate-text-box translate-text-box--result" id="tr-translated-text"></div>
        </div>
      </div>

      <div class="feedback-toast feedback-toast--success" id="translate-copy-feedback" aria-live="polite"></div>

      <div class="action-row">
        <button class="btn btn--primary" id="translate-retranslate-btn">Re-translate</button>
        <button class="btn btn--primary" id="translate-replace-btn">Replace</button>
        <button class="btn btn--secondary" id="translate-copy-btn">Copy</button>
      </div>

      <div class="pb-1"></div>
    </section>

    <!-- ================================================
         VIEW: prompt-editor
    ================================================ -->
    <section id="view-prompt-editor" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="prompt-editor-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <button class="btn btn--icon" id="prompt-editor-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="section-heading">Convert to Prompt</div>

      <div class="translate-input-wrapper">
        <div class="translate-panel-label">Source Text</div>
        <textarea class="translate-text-box translate-text-box--textarea" id="prompt-editor-input" placeholder="Edit text before converting to prompt..."></textarea>
      </div>

      <div class="action-row pt-1">
        <button class="btn btn--primary" id="prompt-editor-confirm-btn">Convert Prompt</button>
      </div>

      <div class="pb-2"></div>
    </section>

    <!-- ================================================
         VIEW: processing
    ================================================ -->
    <section id="view-processing" class="view" tabindex="-1">
      <div class="processing-view">
        <div class="spinner"></div>
        <div class="processing-label" id="processing-label" aria-live="polite">Processing&#x2026;</div>
        <button class="btn btn--ghost" id="processing-cancel-btn">Cancel</button>
      </div>
    </section>

    <!-- ================================================
         VIEW: result
    ================================================ -->
    <section id="view-result" class="view" tabindex="-1">
      <div class="result-header">
        <button class="btn btn--icon-text" id="result-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <div class="result-status" role="status">
          <div class="status-dot status-dot--sm status-dot--success"></div>
          <span class="result-title">Refined Result</span>
        </div>
        <button class="btn btn--icon" id="result-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="result-text-wrapper">
        <div class="result-text-glow"></div>
        <textarea class="result-textarea" id="result-output" readonly></textarea>
        <div class="result-rich-preview" id="result-rich-preview" style="display:none;"></div>
      </div>

      <div class="feedback-toast feedback-toast--success" id="result-copy-feedback" aria-live="polite"></div>

      <div class="action-row">
        <button class="btn-toggle-md" id="result-toggle-md" title="Toggle markdown preview">Rich</button>
        <button class="btn btn--primary" id="result-replace-btn">Replace Selection</button>
        <button class="btn btn--secondary" id="result-copy-btn">Copy</button>
      </div>
    </section>

    <!-- ================================================
         VIEW: error
    ================================================ -->
    <section id="view-error" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="error-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <div class="context-indicator">
          <div class="status-dot status-dot--error"></div>
          <span class="label-upper context-label--error">Error</span>
        </div>
        <button class="btn btn--icon" id="error-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="error-view-inner">
        <div class="error-icon">
          <span data-icon-name="info" data-icon-size="22" data-icon-stroke="2"></span>
        </div>
        <div class="error-title">Something went wrong</div>
        <div class="error-message" id="error-message"></div>
      </div>

      <div class="action-row pt-1">
        <button class="btn btn--primary" id="error-retry-btn">Try Again</button>
        <button class="btn btn--secondary" id="error-dismiss-btn">Dismiss</button>
      </div>

      <div class="pb-2"></div>
    </section>

  </div><!-- /.popup-container -->
</div><!-- /#popup-root -->

<script src="popup.js"></script>
</body>
</html>
