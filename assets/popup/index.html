<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast English</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<div id="popup-root">
  <div class="popup-container">

    <section id="view-editor" class="view" tabindex="-1">
      <div class="popup-header">
        <div class="context-indicator">
          <div class="status-dot status-dot--pulse"></div>
          <span class="label-upper">Editor</span>
        </div>
        <div class="header-actions">
          <button class="btn btn--icon" id="editor-history-btn" aria-label="Recent results" title="Recent results">
            <span data-icon-name="history" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
          <button class="btn btn--icon" id="editor-settings-btn" aria-label="Open settings">
            <span data-icon-name="info" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
          <button class="btn btn--icon" id="editor-close" aria-label="Close">
            <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
        </div>
      </div>

      <div class="tool-switcher" id="tool-switcher" aria-label="Writing tools"></div>

      <div id="translate-controls" class="translate-controls" style="display:none;">
        <div class="lang-select-wrapper">
          <select class="lang-select" id="translate-from-select" aria-label="From language"></select>
          <span class="lang-select-arrow" data-icon-name="chevron_down" data-icon-size="12" data-icon-stroke="2.5"></span>
        </div>

        <button class="btn-swap" id="translate-swap-btn" aria-label="Swap languages">
          <span data-icon-name="swap" data-icon-size="14" data-icon-stroke="2"></span>
        </button>

        <div class="lang-select-wrapper">
          <select class="lang-select" id="translate-to-select" aria-label="To language"></select>
          <span class="lang-select-arrow" data-icon-name="chevron_down" data-icon-size="12" data-icon-stroke="2.5"></span>
        </div>
      </div>

      <div class="error-banner" id="editor-error-banner" hidden>
        <span class="error-banner__icon" data-icon-name="info" data-icon-size="14" data-icon-stroke="2"></span>
        <span class="error-banner__msg"></span>
        <button class="btn btn--ghost" id="editor-error-retry">Retry</button>
        <button class="btn btn--ghost" id="editor-error-dismiss">Dismiss</button>
      </div>

      <div class="editor-main">
        <div class="editor-card">
          <div class="editor-label" id="editor-source-label">Source</div>
          <textarea id="editor-source-text" class="editor-textarea" rows="2" placeholder="Enter text..."></textarea>
        </div>
        <div class="char-count" id="editor-char-count">0 chars</div>
      </div>

      <div class="action-row action-row--editor">
        <button class="btn btn--primary" id="editor-run-btn">Run</button>
        <span class="hint-inline">Ctrl+Enter · Esc</span>
      </div>
    </section>

    <section id="view-processing" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <div class="context-indicator">
          <div class="status-dot status-dot--pulse"></div>
          <span class="label-upper" id="processing-tool">Processing</span>
        </div>
        <button class="btn btn--icon" id="processing-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="processing-view">
        <div class="spinner"></div>
        <div class="processing-label" id="processing-label" aria-live="polite">Processing…</div>
        <div id="processing-stream-output" class="stream-output" role="region" aria-live="polite" aria-label="Streaming output" hidden></div>
        <button class="btn btn--ghost" id="processing-cancel-btn">Cancel</button>
      </div>
    </section>

    <section id="view-result" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="result-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <div class="context-indicator">
          <div class="status-dot status-dot--success"></div>
          <span class="label-upper" id="result-tool-label">Result</span>
        </div>
        <div class="header-actions">
          <button class="btn btn--icon" id="result-close" aria-label="Close">
            <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
        </div>
      </div>

      <div class="result-main">
        <div class="result-notice" id="result-notice" role="status" hidden>
          <span class="result-notice__icon" data-icon-name="info" data-icon-size="13" data-icon-stroke="2"></span>
          <span class="result-notice__msg"></span>
        </div>
        <div class="editor-card result-output-card">
          <div class="editor-label">Output</div>
          <div id="result-output" class="editor-textarea editor-textarea--readonly result-output" tabindex="0" role="region" aria-label="Output"></div>
          <div class="result-rich-preview" id="result-rich-preview" style="display:none;"></div>
          <div class="result-diff" id="result-diff" tabindex="0" role="region" aria-label="Changes from your text" style="display:none;"></div>
        </div>
        <div class="char-count" id="result-char-count">0 chars</div>
        <div class="result-note" id="result-diff-note" role="status" hidden>Too much changed to compare — showing the result on its own.</div>

        <div class="result-source-block">
          <button class="btn btn--ghost result-source-toggle" id="result-source-toggle" aria-expanded="false" aria-controls="result-source-wrap">
            Source snippet
          </button>
          <div class="result-source-wrap" id="result-source-wrap" hidden>
            <textarea id="result-source-snippet" class="editor-textarea editor-textarea--readonly result-source-text" readonly></textarea>
          </div>
        </div>

        <div class="feedback-toast feedback-toast--success" id="result-copy-feedback" aria-live="polite"></div>
      </div>

      <div class="action-row action-row--result">
        <div class="action-group-left">
          <button class="btn btn--icon" id="result-rerun-btn" aria-label="Rerun" title="Rerun">
            <span data-icon-name="refresh" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
          <button class="btn btn--ghost btn-toggle-md" id="result-toggle-md" title="Toggle markdown preview">Preview</button>
          <button class="btn btn--ghost btn-toggle-diff" id="result-toggle-diff" aria-pressed="false" title="Show what changed">Diff</button>
          <button class="btn btn--ghost" id="result-use-output-btn">Edit output</button>
        </div>
        <div class="action-group-right">
          <button class="btn btn--secondary" id="result-copy-btn">Copy</button>
          <button class="btn btn--primary" id="result-replace-btn">Replace</button>
        </div>
      </div>
    </section>

    <section id="view-history" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="history-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <div class="context-indicator">
          <div class="status-dot"></div>
          <span class="label-upper">Recent Results</span>
        </div>
        <div class="header-actions">
          <button class="btn btn--icon" id="history-close" aria-label="Close">
            <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
          </button>
        </div>
      </div>

      <div class="history-main">
        <div id="history-list" class="history-list" role="list" tabindex="0"></div>
        <div id="history-empty" class="history-empty" hidden>No results yet.</div>
      </div>

      <div class="action-row action-row--history">
        <span class="hint-inline" id="history-count"></span>
        <button class="btn btn--ghost" id="history-clear-btn">Clear history</button>
      </div>
    </section>

    <section id="view-error" class="view" tabindex="-1">
      <div class="popup-header popup-header--tight">
        <button class="btn btn--icon-text" id="error-back">
          <span data-icon-name="back" data-icon-size="16" data-icon-stroke="2.5"></span>
          Back
        </button>
        <div class="context-indicator">
          <div class="status-dot status-dot--error"></div>
          <span class="label-upper">Error</span>
        </div>
        <button class="btn btn--icon" id="error-close" aria-label="Close">
          <span data-icon-name="close" data-icon-size="14" data-icon-stroke="2.5"></span>
        </button>
      </div>

      <div class="error-view-inner">
        <div class="error-icon">
          <span data-icon-name="info" data-icon-size="22" data-icon-stroke="2"></span>
        </div>
        <div class="error-title">Something went wrong</div>
        <div class="error-message" id="error-message"></div>
      </div>

      <div class="action-row action-row--error">
        <button class="btn btn--primary" id="error-retry-btn">Try again</button>
        <button class="btn btn--secondary" id="error-dismiss-btn">Dismiss</button>
      </div>
    </section>

  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
