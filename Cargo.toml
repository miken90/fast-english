[package]
name = "fast-english"
version = "0.5.2"
edition = "2021"
description = "Fast English — AI Writing Assistant for Windows"
authors = ["Canh Nguyen"]

[dependencies]
# Windows APIs
windows = { version = "0.58", features = [
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security_Cryptography",
] }
uiautomation = { version = "0.24", features = ["all"] }

# WebView
wry = "0.54"
tao = "0.34"

# System integration
tray-icon = "0.19"
global-hotkey = "0.6"
arboard = "3"

# AI & networking
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
async-trait = "0.1"
anyhow = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows registry (for auto-start)
winreg = "0.55"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
